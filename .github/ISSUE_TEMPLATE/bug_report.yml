name: Bug Report
description: Report a problem with MPDIgnore
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Which component is affected?
      options:
        - mpdignore.py (daemon)
        - ignore-skip.py / ignore.sh / skip.sh
        - install.sh
        - systemd units (mpdignore.service / mpdignore.path)
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Output from `journalctl -u mpdignore.service` or the script itself, if applicable.
      render: shell
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: MPD version / OS
      placeholder: e.g. MPD 0.23.5 on Debian 12
    validations:
      required: false
